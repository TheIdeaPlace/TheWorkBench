name: Release The Card Place for Windows

# A tag like cardplace-windows-v1.0.0 builds the Microsoft Store bundle (x64 and ARM64) from
# that commit, after the whole test suite passes, and keeps it as a workflow artifact to upload
# to Partner Center. The bundle is unsigned on purpose: the Store signs what it publishes, and an
# unsigned MSIX would not install for anyone downloading it, so it is not attached to a GitHub
# release.
#
# The tag must match the <Version> in src/TheCardPlace/TheCardPlace.csproj.
#
#   git tag cardplace-windows-v1.0.0
#   git push origin cardplace-windows-v1.0.0

on:
  push:
    tags:
      - 'cardplace-windows-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  store-bundle:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: thecardplace/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^cardplace-windows-v', ''
          $csproj = Get-Content src/TheCardPlace/TheCardPlace.csproj -Raw
          if ($csproj -notmatch "<Version>$([regex]::Escape($tag))</Version>") {
            throw "Tag $tag does not match the <Version> in TheCardPlace.csproj."
          }
      - name: Build and test
        run: |
          dotnet build TheCardPlace.slnx -c Release
          dotnet test TheCardPlace.slnx -c Release --no-build --filter "Category!=UI"
          dotnet test tests/TheCardPlace.UiTests -c Release --no-build --blame-hang-timeout 3m --blame-hang-dump-type none
      - name: Build the Store bundle
        shell: pwsh
        run: |
          $require = if ('${{ github.ref }}'.StartsWith('refs/tags/')) { '-RequireIdentity' } else { '' }
          if ($require -and (Get-Content build/store/identity.json -Raw) -match 'FROM-PARTNER-CENTER') {
            Write-Warning 'identity.json still holds placeholders: building a test bundle only. Fill it in from Partner Center, Product identity.'
            $require = ''
          }
          & ./build/package-store.ps1 @($require | Where-Object { $_ })
      - uses: actions/upload-artifact@v4
        with:
          name: TheCardPlace-store-bundle
          path: thecardplace/windows/artifacts/*.msixbundle
          if-no-files-found: error
