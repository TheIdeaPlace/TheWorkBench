name: Publish site

# Despite the original name, this publishes the WHOLE site: it rsyncs the repo
# into _site and force-pushes that to gh-pages. Converting one markdown file with
# pandoc is a single step among everything else it carries.
#
# It used to trigger only on that one markdown file, which meant every change to
# either card game had to be published by hand — and a merge by anyone who did
# not know that left the live site silently behind main. The games are what
# people actually visit, so they trigger it too.
#
# Everything reaching main goes through a pull request and the card game tests
# run on every pull request, so this is not publishing untested code.

# EVERY published directory has to be listed here. It publishes the whole repo,
# so a missing path does not publish a broken site — it publishes nothing at
# all, and the live site silently stays on the last commit that happened to
# touch a listed directory. euchre/, cribbage-multiplayer/ and shared/ were all
# missing at once: two of the five games on The Card Place could be changed,
# merged and tested green without any of it reaching anybody. It went unnoticed
# because those games were only ever merged alongside sheephead-multiplayer/,
# which is listed, so something always triggered it by accident.
#
# The eight lines that bug lived in are now one, because the games are one
# directory. That is the point of the move rather than a side effect of it: a
# sixth game added under thecardplace/ publishes without anybody remembering to
# come back here, and there is no longer a list that can be one entry short.
#
on:
  push:
    branches:
      - main
    paths:
      - 'devdocs/CONTROLLING_IPHONE_FROM_MAC.md'
      - 'thecardplace/**'
      - 'thecardplace.html'
      # The 404 page is what turns the pre-move game URLs — the ones written
      # into every bug report a player has ever filed — back into working
      # links. A change to it that never publishes is a change that does
      # nothing at all, and nothing else would say so.
      - '404.html'
      - '.github/workflows/publish-guide.yml'
  workflow_dispatch:

permissions:
  contents: write

# This force-pushes an orphan branch. Without a concurrency group, two merges
# landing close together race and the last writer wins — which may be the run
# that checked out the OLDER commit, silently reverting the live site. Adding a
# third trigger path (sheephead-multiplayer/) made that more likely, not less.
# Not cancel-in-progress: a half-finished publish is worse than a queued one.
concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.1.11'

      - name: Convert Markdown to HTML
        run: |
          mkdir -p _site/devdocs
          rsync -a --exclude='_site' . _site/
          pandoc \
            --from markdown+smart \
            --to html5 \
            --template .github/pandoc-template.html5 \
            --standalone \
            devdocs/CONTROLLING_IPHONE_FROM_MAC.md \
            --output _site/devdocs/controlling-iphone-from-mac.html
          # The publish action runs `git add --all` inside _site, which honours any
          # .gitignore it finds there. Exactly one root pattern is a problem — the
          # generated HTML this job just produced — so drop that one line rather
          # than the whole file.
          #
          # This used to `rm -f _site/.gitignore`, which also discarded .claude/,
          # Config.swift and every build-output pattern. Nothing leaked, because
          # the job runs on a fresh checkout where none of those files exist. The
          # hazard is what comes next: once sheephead-multiplayer/ has a
          # wrangler.toml or a .dev.vars, the instinctive place to exclude a secret
          # is the root .gitignore — the very file this step was deleting. Nested
          # .gitignore files are NOT removed, so a secret pattern belongs in the
          # directory that owns it.
          sed -i '\|^devdocs/controlling-iphone-from-mac\.html$|d' _site/.gitignore

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish: auto-generated HTML from markdown"
