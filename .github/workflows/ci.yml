name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build QuickCalc.slnx -c Release
      - name: Engine tests
        run: dotnet test tests/QuickCalc.Core.Tests -c Release --no-build
      - name: UI tests (drive the real app through UI Automation)
        run: dotnet test tests/QuickCalc.UiTests -c Release --no-build --blame-hang-timeout 2m --blame-hang-dump-type none
