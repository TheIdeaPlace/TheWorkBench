name: The Card Place for Windows tests

# Builds the Windows app and runs every test: the five engines, the sessions that play whole
# games through the app's own controls, and the UI Automation tests that launch the real app,
# send keys and listen for what a screen reader would be told. The UI tests take focus and type,
# which belongs on a machine nobody is using: here, or the test VM.
#
# Scoped by path so the browser games and the other projects in this repository do not trigger it.

on:
  push:
    branches: [main]
    paths:
      - 'thecardplace/windows/**'
      - '.github/workflows/cardplace-windows-tests.yml'
  pull_request:
    paths:
      - 'thecardplace/windows/**'
      - '.github/workflows/cardplace-windows-tests.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: thecardplace/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (warnings are errors)
        run: dotnet build TheCardPlace.slnx -c Release
      - name: Engine and session tests
        run: dotnet test TheCardPlace.slnx -c Release --no-build --filter "Category!=UI" --logger trx --results-directory TestResults
      - name: UI tests (drive the real app through UI Automation)
        run: dotnet test tests/TheCardPlace.UiTests -c Release --no-build --logger trx --results-directory TestResults --blame-hang-timeout 3m --blame-hang-dump-type none
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cardplace-windows-test-results
          path: thecardplace/windows/TestResults
