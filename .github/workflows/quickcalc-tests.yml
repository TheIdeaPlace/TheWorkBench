name: QuickCalc tests

# Builds QuickCalc and runs its engine tests and its UI Automation tests on GitHub's machines.
# The UI tests launch the app and send real keystrokes, which is no good on a machine where
# somebody is working or listening to a screen reader, so this is where they belong.
#
# Scoped by path so other projects in this repo do not trigger a QuickCalc run, and vice versa.

on:
  push:
    branches: [main]
    paths:
      - 'quickcalc/**'
      - '.github/workflows/quickcalc-tests.yml'
  pull_request:
    paths:
      - 'quickcalc/**'
      - '.github/workflows/quickcalc-tests.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: quickcalc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build QuickCalc.slnx -c Release
      - name: Engine tests
        run: dotnet test tests/QuickCalc.Core.Tests -c Release --no-build --logger trx --results-directory TestResults
      - name: UI tests (drive the real app through UI Automation)
        run: dotnet test tests/QuickCalc.UiTests -c Release --no-build --logger trx --results-directory TestResults --blame-hang-timeout 2m --blame-hang-dump-type none
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quickcalc-test-results
          path: quickcalc/TestResults
