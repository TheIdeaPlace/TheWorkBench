name: Card game tests

# Runs both card games' suites on GitHub's machines rather than on a
# contributor's. That is not only tidiness: the browser-driven suites launch real
# headless Chrome across several viewports, and on a machine where somebody is
# listening to a screen reader, that CPU spike is heard.
#
# Scoped by path so unrelated projects in this repo do not trigger a card game
# test run, and vice versa.

on:
  push:
    branches: [main]
    paths:
      - 'thecardplace/sheephead/**'
      - 'thecardplace/sheephead-multiplayer/**'
      - 'thecardplace/euchre/**'
      - 'thecardplace/Cribbage/**'
      - 'thecardplace/cribbage-multiplayer/**'
      - 'thecardplace/hearts/**'
      - 'thecardplace/spades/**'
      - 'thecardplace/shared/**'
      - '.github/workflows/card-games-tests.yml'
  pull_request:
    paths:
      - 'thecardplace/sheephead/**'
      - 'thecardplace/sheephead-multiplayer/**'
      - 'thecardplace/euchre/**'
      - 'thecardplace/Cribbage/**'
      - 'thecardplace/cribbage-multiplayer/**'
      - 'thecardplace/hearts/**'
      - 'thecardplace/spades/**'
      - 'thecardplace/shared/**'
      - '.github/workflows/card-games-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: card-games-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The transport every game runs on, and the contract every engine has to meet.
  # This job is why shared/** is in the path filters above: net.js is now the
  # wire for three games, and until this existed a change to it triggered no
  # tests at all.
  #
  # It is deliberately not inside any game. What it checks is what no single
  # game can see — that no two of them point at the same room service, and that
  # they all mean the same thing by seatToAct and canDeal. Both of those were
  # wrong when it was written, and every game suite passed anyway.
  shared:
    name: Shared layer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every path below is relative to the games' own directory rather than the
    # repository root, exactly as the per-game jobs are. That is what let the
    # move under thecardplace/ leave the run: lines in this job untouched —
    # `node shared/tests/wiring.js` still says what it means, and the loop that
    # bundles the Workers still names them the way a person standing in that
    # directory would.
    defaults:
      run:
        working-directory: thecardplace
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Wiring
        run: node shared/tests/wiring.js
      - name: Engine contract
        run: node shared/tests/engine-contract.js

      # What happens when somebody reloads the page. Shared, and here rather
      # than in any one game, because room.js, net.js, localserver.js and
      # table.js are one copy behind all five — so a reload that loses the log
      # loses it everywhere, and no single game's suite can see that.
      - name: Reloading the page is not the end of the game
        run: node shared/tests/reload.js

      # Bytes, not text. Four regexes in this repository were written as a word
      # boundary and arrived as a literal backspace, so they matched nothing and
      # the assertions around them could never fail. Nothing else can see that:
      # the file parses, the suite goes green, and a diff renders 0x08 as
      # nothing at all. Cheap, and it caught its own first draft.
      - name: No invisible characters in source
        run: node shared/tests/no-control-characters.js
      - name: Settings carried over from the old address
        run: node shared/tests/settings-import.js

      # Do the games agree with EACH OTHER? Every other audit asks whether one
      # game is right; each of them passed while the set of them drifted apart,
      # and it was a player moving between games who noticed. Needs a browser,
      # because the thing it measures last — how far the log is from the hand —
      # depends on what is focusable in between and cannot be read off the
      # markup.
      - name: The games have the same shape
        run: |
          set -euo pipefail
          npm install --no-save puppeteer
          node shared/tests/browser/shape.js 2>&1 | tee /tmp/shape.txt
          # A skip here would exit 0 and read as a pass. This audit is the only
          # thing checking the games against each other, so it silently not
          # running is exactly the failure it exists to prevent.
          if grep -q "^SKIP" /tmp/shape.txt; then
            echo "::error::The cross-game shape audit skipped instead of running."
            exit 1
          fi

      # The Workers import shared/js/room.js from outside their own directory.
      # Nothing else here would notice a broken import: the game suites do not
      # bundle, and the deploy that would fail only runs after the merge — on
      # main, against the live room. Bundling is a few milliseconds.
      #
      # Found by glob rather than named, because the named list was already one
      # short: spades shipped a Worker and a deploy workflow and was never in
      # it, so a broken import there would have reached the live room with
      # every check green. A list of games that has to be edited when a game is
      # added is the same bug this workflow's path filters had. The glob cannot
      # go short, and the guard below is there because a glob that matches
      # nothing succeeds silently, which would be the same failure wearing a
      # different hat.
      - name: Every Worker still bundles
        run: |
          set -euo pipefail
          npm install --no-save esbuild
          found=0
          for w in */worker/src/index.js; do
            [ -f "$w" ] || continue
            echo "bundling $w"
            npx esbuild --bundle "$w" --format=esm --outfile=/dev/null
            found=$((found + 1))
          done
          if [ "$found" -lt 5 ]; then
            echo "::error::Only $found Workers were bundled. There are five multiplayer games; if one lost its worker/src/index.js, its deploy is the next thing to break."
            exit 1
          fi
          echo "$found Workers bundle."

  # Hearts. No fork and no stable twin — it was built on the shared layer from
  # the first line, so there is no copy of it anywhere to guard against.
  hearts:
    name: Hearts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: thecardplace/hearts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install browser test dependencies
        run: npm install --no-save puppeteer

      - name: Rules oracle
        run: npm run test:rules

      - name: Authorization
        run: npm run test:auth

      - name: Projection
        run: npm run test:projection

      - name: Over the transport
        run: npm run test:online

      - name: Text contrast
        run: npm run test:contrast

      - name: Card faces do not collide
        run: npm run test:overlap

      - name: Rendered appearance
        run: npm run test:appearance

      - name: Shared keyboard
        run: npm run test:keys

      - name: The log reads the same way everywhere
        run: npm run test:log

      - name: Everything renders
        run: npm run test:renders

      - name: Interface
        run: npm run test:uidom

      - name: Layout across viewports
        run: npm run test:layout

      - name: Fail if anything skipped
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/out.txt
          if grep -q '^SKIP' /tmp/out.txt; then
            echo "::error::A test suite skipped instead of running. CI must not report success on a skip."
            grep '^SKIP' /tmp/out.txt
            exit 1
          fi

  # Spades. Four seats in two fixed partnerships, and the first game here whose
  # scoring earns a suite of its own: a contract belongs to a pair, missing it
  # costs the whole bid rather than the difference, and bags carry across hands.
  spades:
    name: Spades
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: thecardplace/spades
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install browser test dependencies
        run: npm install --no-save puppeteer

      - name: Rules oracle
        run: npm run test:rules

      - name: Authorization
        run: npm run test:auth

      - name: Projection
        run: npm run test:projection

      # Spades' own two, and neither exists in another game. The scoring is
      # checked against worked examples rather than against play, because two
      # implementations written on the same afternoon share the same
      # misunderstandings. The balance suite measures whether the bidding is
      # still a decision, which is the thing that degrades silently: a game
      # where every contract is made is correct, passes everything else, and is
      # not worth playing.
      - name: Scoring, against worked examples
        run: npm run test:scoring

      - name: The bidding is still a game
        run: npm run test:balance

      - name: Over the transport
        run: npm run test:online

      - name: Text contrast
        run: npm run test:contrast

      - name: Card faces do not collide
        run: npm run test:overlap

      - name: Rendered appearance
        run: npm run test:appearance

      - name: Shared keyboard
        run: npm run test:keys

      - name: The log reads the same way everywhere
        run: npm run test:log

      - name: Everything renders
        run: npm run test:renders

      - name: Interface
        run: npm run test:uidom

      - name: Layout across viewports
        run: npm run test:layout

      - name: Fail if anything skipped
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/out.txt
          if grep -q '^SKIP' /tmp/out.txt; then
            echo "::error::A test suite skipped instead of running. CI must not report success on a skip."
            grep '^SKIP' /tmp/out.txt
            exit 1
          fi

  sheephead:
    name: Sheephead
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: thecardplace/sheephead
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Neither package.json declares dependencies — the games ship with none,
      # and the tests skip cleanly without them so a contributor can run the
      # pure-Node suites on a bare checkout. That is the right behaviour locally
      # and exactly the wrong behaviour here, so CI installs them explicitly and
      # then refuses to accept a skip. See the guard step below.
      - name: Install test dependencies
        run: npm install --no-save jsdom puppeteer

      - name: Rules oracle
        run: npm run test:rules

      - name: Full suite
        run: npm test

      # A suite that skips is a suite that proved nothing. Locally that prints a
      # SKIP line and exits 0, which is friendly; here it would be a green tick
      # over an empty run — the same shape of lie as a piped exit code.
      - name: Fail if anything skipped
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/out.txt
          if grep -q '^SKIP' /tmp/out.txt; then
            echo "::error::A test suite skipped instead of running. CI must not report success on a skip."
            grep '^SKIP' /tmp/out.txt
            exit 1
          fi

      - name: Layout across viewports
        run: npm run test:layout

      # The stable game is audited by the same shared script as the forks. It
      # had the identical 1.41:1 felt bug they did, which is what a shared
      # stylesheet lineage buys you, and nothing here had ever measured it.
      - name: Text contrast
        run: npm run test:contrast

      - name: Card faces do not collide
        run: npm run test:overlap

      - name: Randomness
        run: node tests/randomness.js

      - name: Rendered appearance
        run: npm run test:appearance

      - name: Shared keyboard
        run: npm run test:keys

      - name: The log reads the same way everywhere
        run: npm run test:log

      - name: Everything renders
        run: npm run test:renders

  # The multiplayer fork runs the same suite as the game it was copied from, and
  # additionally enforces the constraint the fork exists for: that multiplayer
  # work does not touch the stable game.
  #
  # That guard is here because a review pointed out the claim had no teeth. The
  # commit that created the fork said this job "is what will tell us if that ever
  # stops being true", and it would not have — it only ran the fork's own tests.
  # An invariant nothing checks is a comment, not an invariant.
  sheephead-multiplayer:
    name: Sheephead Multiplayer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: thecardplace/sheephead-multiplayer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Deliberately not scoped to this workflow's path filters: the point is to
      # catch a change to sheephead/ arriving alongside multiplayer work, which
      # is exactly when nobody is looking for it.
      - name: This branch must not change both the stable game and its fork
        working-directory: .
        run: bash .github/scripts/fork-guard.sh thecardplace/sheephead/ thecardplace/sheephead-multiplayer/ ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install test dependencies
        run: npm install --no-save jsdom puppeteer

      - name: Rules oracle
        run: npm run test:rules

      - name: Full suite
        run: npm test

      - name: Fail if anything skipped
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/out.txt
          if grep -q '^SKIP' /tmp/out.txt; then
            echo "::error::A test suite skipped instead of running. CI must not report success on a skip."
            grep '^SKIP' /tmp/out.txt
            exit 1
          fi

      - name: Layout across viewports
        run: npm run test:layout

      - name: Text contrast
        run: npm run test:contrast

      - name: Card faces do not collide
        run: npm run test:overlap

      - name: Rendered appearance
        run: npm run test:appearance

      - name: Shared keyboard
        run: npm run test:keys

      - name: The log reads the same way everywhere
        run: npm run test:log

      - name: Everything renders
        run: npm run test:renders

      - name: Randomness
        run: node tests/randomness.js

  euchre:
    name: Euchre
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: thecardplace/euchre
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # The game ships with no dependencies and the tests skip cleanly without
      # them, so a contributor can run the pure-Node suites on a bare checkout.
      # That is the right behaviour locally and exactly the wrong behaviour here,
      # so CI installs them and then refuses to accept a skip.
      - name: Install test dependencies
        run: npm install --no-save jsdom puppeteer

      # First, on its own, because it is the only test that knows what euchre IS.
      # Everything after it checks the game is consistent with itself, which a
      # swapped rank table passes with the wrong player winning every trick.
      - name: Rules oracle
        run: npm run test:rules

      - name: Full suite
        run: npm test

      # A suite that skips is a suite that proved nothing. Locally that prints a
      # SKIP line and exits 0, which is friendly; here it would be a green tick
      # over an empty run.
      - name: Fail if anything skipped
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/out.txt
          if grep -q '^SKIP' /tmp/out.txt; then
            echo "::error::A test suite skipped instead of running. CI must not report success on a skip."
            grep '^SKIP' /tmp/out.txt
            exit 1
          fi

      # Real headless Chrome across six viewports at two text sizes. Kept out of
      # `npm test` because it spins up a browser; it is the only thing that would
      # notice the layout coming apart when somebody turns their text size up.
      - name: Layout across viewports
        run: npm run test:layout

      - name: Text contrast
        run: npm run test:contrast

      - name: Card faces do not collide
        run: npm run test:overlap

      - name: Rendered appearance
        run: npm run test:appearance

      - name: Shared keyboard
        run: npm run test:keys

      - name: The log reads the same way everywhere
        run: npm run test:log

      - name: Everything renders
        run: npm run test:renders

      # Not an assertion, just numbers worth having in the log: how often a suit
      # gets named, how often the makers are euchred. A sharp move in either
      # after an AI change is a signal even though nothing here fails on it.
      - name: Balance (informational)
        run: npm run balance
        continue-on-error: true

  # The cribbage fork runs its own suite and additionally enforces the constraint
  # the fork exists for: that multiplayer work does not touch the stable game.
  # An invariant nothing checks is a comment, not an invariant — which is why the
  # sheephead fork grew the same step.
  cribbage-multiplayer:
    name: Cribbage Multiplayer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: thecardplace/cribbage-multiplayer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Deliberately not scoped to this workflow's path filters: the point is to
      # catch a change to Cribbage/ arriving alongside multiplayer work, which is
      # exactly when nobody is looking for it.
      - name: This branch must not change both the stable game and its fork
        working-directory: .
        run: bash .github/scripts/fork-guard.sh thecardplace/Cribbage/ thecardplace/cribbage-multiplayer/ ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install test dependencies
        run: npm install --no-save jsdom puppeteer

      # First, on its own, because it is the only test that knows what cribbage
      # IS. Everything after it checks the game is consistent with itself, which
      # an under-counted double run passes happily.
      - name: Rules oracle
        run: npm run test:rules

      - name: Full suite
        run: npm test

      - name: Fail if anything skipped
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/out.txt
          if grep -q '^SKIP' /tmp/out.txt; then
            echo "::error::A test suite skipped instead of running. CI must not report success on a skip."
            grep '^SKIP' /tmp/out.txt
            exit 1
          fi

      - name: Layout across viewports
        run: npm run test:layout

      - name: Text contrast
        run: npm run test:contrast

      - name: Card faces do not collide
        run: npm run test:overlap

      - name: Rendered appearance
        run: npm run test:appearance

      - name: Shared keyboard
        run: npm run test:keys

      - name: The log reads the same way everywhere
        run: npm run test:log

      - name: Everything renders
        run: npm run test:renders

  cribbage:
    name: Cribbage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: thecardplace/Cribbage
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install test dependencies
        run: npm install --no-save jsdom puppeteer

      - name: Rules oracle
        run: npm run test:rules

      - name: Full suite
        run: npm test

      - name: Fail if anything skipped
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/out.txt
          if grep -q '^SKIP' /tmp/out.txt; then
            echo "::error::A test suite skipped instead of running. CI must not report success on a skip."
            grep '^SKIP' /tmp/out.txt
            exit 1
          fi

      - name: Randomness
        run: node tests/randomness.js

      - name: Invariants
        run: node tests/invariants.js

      # Not an assertion, just a number worth having in the log: the computer's
      # win rate against a deliberately plain baseline opponent. A sharp move in
      # it after an AI change is a signal even though nothing here fails on it.
      - name: Balance (informational)
        run: node simulate.js 200
        continue-on-error: true
