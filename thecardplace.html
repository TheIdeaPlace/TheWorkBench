<!DOCTYPE html>
<!--
  The Card Place moved from this file to thecardplace/index.html, and this is
  what is left at the old address.

  Not tidiness — this URL is the one in the README, the one that has been sent
  to people, and the one anybody who plays these games has bookmarked. A move
  that silently 404s all of them is a worse outcome than one stub file at the
  root, which is the whole scatter this reorganisation was meant to end and is
  the one piece of it worth keeping.

  Both a meta refresh and a real link: the refresh does the work, and the link
  is what somebody sees if it is disabled or slow. The link is focusable and
  the heading says where they are going, so this reads correctly out loud
  rather than as an empty page that moves on its own.

  It can go the day the games leave this repository for good, and it should.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Card Place has moved</title>
<meta http-equiv="refresh" content="0; url=thecardplace/">
<link rel="canonical" href="thecardplace/">
<link rel="icon" href="thecardplace/shared/favicon.svg" type="image/svg+xml">
<style>
  body { font: 1rem/1.6 system-ui, sans-serif; margin: 3rem auto; max-width: 34rem; padding: 0 1rem; }
  a { color: #0b5fff; }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #eee; }
    a { color: #79b0ff; }
  }
</style>
</head>
<body>
<h1>The Card Place has moved</h1>
<p>It now lives at <a href="thecardplace/">The Card Place</a>. You should be sent there
automatically; if not, follow the link.</p>
</body>
</html>
