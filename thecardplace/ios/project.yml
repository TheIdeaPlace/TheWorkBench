# The Card Place for iOS. Generate the Xcode project with:
#
#     cd thecardplace/ios && xcodegen generate
#
# The rules of the games live in the CardGamesKit package next to this file;
# the app is SwiftUI on top of it. Nothing here talks to a network.
name: TheCardPlace
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: P887QF74N8
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  CardGamesKit:
    path: CardGamesKit
targets:
  TheCardPlace:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TheCardPlace
    info:
      path: TheCardPlace/Info.plist
      properties:
        CFBundleDisplayName: The Card Place
        # Without these xcodegen writes a literal build 1 into the plist, and
        # App Store Connect refuses every upload after the first.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: false
    dependencies:
      - package: CardGamesKit
        product: CardCore
      - package: CardGamesKit
        product: HeartsEngine
      - package: CardGamesKit
        product: EuchreEngine
      - package: CardGamesKit
        product: SpadesEngine
      - package: CardGamesKit
        product: CribbageEngine
      - package: CardGamesKit
        product: SheepheadEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.theideaplace.TheCardPlace
        PRODUCT_NAME: The Card Place
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 6
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
  # Plays the games the way VoiceOver would: by the labels on the controls.
  TheCardPlaceUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TheCardPlaceUITests
    dependencies:
      - target: TheCardPlace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.theideaplace.TheCardPlaceUITests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TheCardPlace:
    build:
      targets:
        TheCardPlace: all
        TheCardPlaceUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TheCardPlaceUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
